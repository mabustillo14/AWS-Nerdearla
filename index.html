<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra Papel Tijera - Juego con Cámara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Piedra Papel Tijera</h1>
        <div class="game-area">
            <div class="camera-section">
                <video id="video" autoplay muted></video>
                <canvas id="canvas"></canvas>
                <div class="detection-result">
                    <p>Muestra tu mano: <span id="detected-gesture">Ninguna</span></p>
                </div>
            </div>
            <div class="game-info">
                <div class="scores">
                    <div class="score">
                        <h3>Tú</h3>
                        <span id="player-score">0</span>
                    </div>
                    <div class="score">
                        <h3>Computadora</h3>
                        <span id="computer-score">0</span>
                    </div>
                </div>
                <div class="choices">
                    <div class="choice">
                        <h4>Tu Elección</h4>
                        <div id="player-choice">?</div>
                    </div>
                    <div class="choice">
                        <h4>Elección de la Computadora</h4>
                        <div id="computer-choice">?</div>
                    </div>
                </div>
                <div class="result">
                    <p id="game-result">¡Haz tu jugada!</p>
                </div>
                <button id="play-btn" disabled>Detectando...</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="script.js"></script>
</body>
</html>
